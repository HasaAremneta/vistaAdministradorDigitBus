<!-- NAV ADMIN ARRIBA -->
<app-admin-navbar></app-admin-navbar>

<!-- CONTENIDO PRINCIPAL -->
<div class="admin-solicitudes-page">
  <div class="card-solicitudes">
    <h2>Reportes de incidentes</h2>

    <div class="tabla-wrapper">
      <table class="tabla-incidentes">
        <thead>
          <tr class="columnaTitulos">
            <th>ID</th>
            <th>Nombre de usuario</th>
            <th>Nombre completo</th>
            <th>Correo</th>
            <th>Motivo</th>
            <th>Status</th>
            <th colspan="2">Acción</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let r of pagedReportes">
            <td class="col-id">{{ r.id }}</td>
            <td>{{ r.nombreUsuario }}</td>
            <td>{{ r.nombreCompleto }}</td>
            <td>{{ r.correo }}</td>
            <td class="link-azul">{{ r.tipo }}</td>
            <td>
              <span
                [ngClass]="{
                  'status-revision': r.status === 'PENDIENTE' || r.status === 'Revisión' || r.status === 'Pendiente',
                  'status-concluida': r.status === 'Concluida',
                  'status-rechazada': r.status === 'Rechazada'
                }"
              >
                {{ r.status }}
              </span>
            </td>
            <td class="link-azul accion" (click)="abrirDetalle(r)">Ver</td>
            <td class="link-azul accion" (click)="eliminar(r)">Eliminar</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="paginacion">
      <div class="paginacion-info">
        Página <strong>{{ currentPage }}</strong> de <strong>{{ totalPages }}</strong>
      </div>

      <div class="paginacion-controles">
        <button
          class="page-btn"
          (click)="prevPage()"
          [disabled]="currentPage === 1"
        >
          ‹ Anterior
        </button>

        <button
          class="page-btn"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
        >
          Siguiente ›
        </button>
      </div>

      <div class="paginacion-size">
        <span>Mostrar por página:</span>
        <span class="badge">{{ pageSize }}</span>
      </div>
    </div>
  </div>
</div>

<!-- MODAL ENCIMA: solo se muestra cuando mostrarDetalle = true -->
<app-datosolicitud
  *ngIf="mostrarDetalle"
  [reporte]="reporteSeleccionado"
  (cerrar)="cerrarDetalle()"
  (aceptar)="onAceptarSolicitud()"
  (rechazar)="onRechazarSolicitud()"
></app-datosolicitud>
