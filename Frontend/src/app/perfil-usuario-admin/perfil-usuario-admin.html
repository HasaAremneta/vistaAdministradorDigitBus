<div class="overlay-perfil">
  <div class="modal-perfil">
    <button class="flecha" (click)="onCerrar()">← Regresar</button>

    <h1>Perfil del usuario</h1>

    <!-- DATOS DEL USUARIO -->
    <section class="datos-section">

      <div class="campo">
        <label>ID usuario</label>
        <input type="text" [(ngModel)]="usuario.id" disabled />
      </div>

      <div class="campo">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="usuario.nombre" />
      </div>

      <div class="campo">
        <label>Apellido Paterno</label>
        <input type="text" [(ngModel)]="usuario.apellidoPaterno" />
      </div>

      <div class="campo">
        <label>Apellido Materno</label>
        <input type="text" [(ngModel)]="usuario.apellidoMaterno" />
      </div>

      <div class="campo">
        <label>Nombre de usuario</label>
        <input type="text" [(ngModel)]="usuario.username" />
      </div>

      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" [(ngModel)]="usuario.email" />
      </div>

    </section>

    <!-- CONTRASEÑA -->
    <section class="password-section">
      <h2>Contraseña</h2>
      <p class="texto-ayuda">
        Puedes generar una nueva contraseña para el usuario.
      </p>

      <div class="campo">
        <label>Nueva contraseña</label>
        <input 
          type="password" 
          placeholder="Escribe una nueva contraseña" 
          [(ngModel)]="nuevaPassword"
        />
      </div>
    </section>

    <!-- BOTONES -->
    <div class="footer-perfil">
      <button class="btn-cancelar" (click)="onCerrar()">Cancelar</button>
      <button class="btn-guardar" (click)="onGuardar()">Guardar cambios</button>
    </div>

  </div>
</div>
